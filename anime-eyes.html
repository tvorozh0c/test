<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДР Полино + аниме глаза</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0f;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #fff;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }
  .content {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
  }
  h1 {
    font-size: clamp(1.8rem, 5vw, 3.5rem);
    font-weight: 300;
    letter-spacing: 2px;
    margin-bottom: 40px;
    text-shadow: 0 0 20px rgba(255,255,255,0.3);
  }
  .timer {
    display: flex;
    gap: clamp(10px, 3vw, 30px);
    flex-wrap: wrap;
    justify-content: center;
  }
  .unit {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 20px 25px;
    min-width: 100px;
    backdrop-filter: blur(10px);
  }
  .num {
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
  }
  .label {
    font-size: 0.85rem;
    opacity: 0.6;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 6px;
  }
</style>
</head>
<body>

<canvas id="dots"></canvas>

<div class="content">
  <h1>ДР Полино через:</h1>
  <div class="timer">
    <div class="unit"><div class="num" id="days">00</div><div class="label">дней</div></div>
    <div class="unit"><div class="num" id="hours">00</div><div class="label">часов</div></div>
    <div class="unit"><div class="num" id="minutes">00</div><div class="label">минут</div></div>
    <div class="unit"><div class="num" id="seconds">00</div><div class="label">секунд</div></div>
  </div>
</div>

<script>
/* ---------- Таймер до 23 сентября ---------- */
function getTargetDate() {
  const now = new Date();
  let year = now.getFullYear();
  let target = new Date(year, 8, 23); // месяц 8 = сентябрь
  if (target < now) target = new Date(year + 1, 8, 23);
  return target;
}
const target = getTargetDate();

function updateTimer() {
  const diff = target - new Date();
  if (diff <= 0) {
    document.querySelector('h1').textContent = '🎉 С Днём Рождения, Полина! 🎉';
    return;
  }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff / 3600000) % 24);
  const m = Math.floor((diff / 60000) % 60);
  const s = Math.floor((diff / 1000) % 60);
  document.getElementById('days').textContent    = String(d).padStart(2,'0');
  document.getElementById('hours').textContent   = String(h).padStart(2,'0');
  document.getElementById('minutes').textContent = String(m).padStart(2,'0');
  document.getElementById('seconds').textContent = String(s).padStart(2,'0');
}
updateTimer();
setInterval(updateTimer, 1000);

/* ---------- Интерактивные точки ---------- */
let eyes = [];           // объявляем заранее — используется в resize()/setupEyes()
const canvas = document.getElementById('dots');
const ctx = canvas.getContext('2d');
let W, H, dots = [];
const mouse = { x: -9999, y: -9999 };
const GAP = 35;        // расстояние между точками в сетке
const RADIUS = 1.2;    // базовый радиус точки
const MAX_R = 6;       // максимальный радиус
const RANGE = 150;     // радиус влияния курсора

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  dots = [];
  const cols = Math.ceil(W / GAP) + 1;
  const rows = Math.ceil(H / GAP) + 1;
  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      dots.push({ x: i * GAP, y: j * GAP });
    }
  }
  setupEyes();
}
window.addEventListener('resize', resize);
resize();

function onMove(e) {
  const t = e.touches ? e.touches[0] : e;
  mouse.x = t.clientX;
  mouse.y = t.clientY;
}
window.addEventListener('mousemove', onMove);
window.addEventListener('touchmove', onMove, { passive: true });
window.addEventListener('touchstart', onMove, { passive: true });
window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

/* ---------- Аниме глаза из точек с морганием ---------- */
// Форма глаза — широкая «капля»/эллипс, как у аниме-персонажей.
function eyeShape(u, v) {
  // u in [-1,1] горизонталь, v in [-1,1] вертикаль
  // Возвращает true, если точка (u,v) внутри контура глаза
  const rx = 1.0;
  let ry = 0.78 * (1 - 0.25 * u * u); // чуть заостряем к краям
  // верхний век слегка нависает
  const lidTop = 1 + 0.18 * u * u;
  const inside = (u * u) / (rx * rx) + (v * v) / (ry * ry * lidTop) <= 1;
  return inside;
}

function setupEyes() {
  const eyeScale = Math.min(W, H) * 0.16; // размер глаза
  const gap = eyeScale * 1.9;             // расстояние между глазами
  const cy = H * 0.32;                    // высота глаз (над таймером)
  eyes = [
    { cx: W / 2 - gap / 2, cy: cy, s: eyeScale, sign: -1 },
    { cx: W / 2 + gap / 2, cy: cy, s: eyeScale, sign:  1 },
  ];
}

// Собираем точки, попадающие внутрь каждого глаза
function buildEyeDots() {
  const result = [[], []];
  const step = GAP * 0.5; // точки глаз плотнее основной сетки
  for (let ei = 0; ei < 2; ei++) {
    const e = eyes[ei];
    for (let x = -e.s * 1.1; x <= e.s * 1.1; x += step) {
      for (let y = -e.s * 0.95; y <= e.s * 0.95; y += step) {
        const u = x / e.s;
        const v = y / e.s;
        if (eyeShape(u, v)) {
          result[ei].push({
            ox: e.cx + x,           // покоящаяся позиция
            oy: e.cy + y,
            u: u, v: v,             // нормализованные координаты внутри глаза
            pupil: false
          });
        }
      }
    }
  }
  return result;
}

// Зрачок — отдельное пятно точек, следит за курсором
function pupilPoints(ei, lookX, lookY, blink) {
  const e = eyes[ei];
  const pts = [];
  const pr = e.s * 0.34;                       // радиус зрачка
  const maxOff = e.s * 0.42 * (1 - blink);     // насколько зрачок смещается
  const px = e.cx + lookX * maxOff;
  const py = e.cy + lookY * maxOff * 0.8;
  const step = GAP * 0.45;
  for (let x = -pr; x <= pr; x += step) {
    for (let y = -pr * (1 - blink * 0.9); y <= pr * (1 - blink * 0.9); y += step) {
      if ((x * x + y * y) <= pr * pr * (1 - blink) ) {
        pts.push({ x: px + x, y: py + y });
      }
    }
  }
  return pts;
}

/* ---------- Логика моргания ---------- */
let nextBlinkTime = performance.now() + 2000 + Math.random() * 3000;
let blinkStart = null;          // время начала моргания
const BLINK_DUR = 160;          // длительность закрытия/открытия, мс
let blinkPhase = 0;             // 0..1, 1 = полностью закрыт

function getBlink(now) {
  if (blinkStart === null) {
    if (now >= nextBlinkTime) {
      blinkStart = now;
    }
    return 0;
  }
  const t = now - blinkStart;
  const half = BLINK_DUR;
  if (t < half) {
    return t / half;                 // закрываемся
  } else if (t < half * 2) {
    return 1 - (t - half) / half;    // открываемся
  } else {
    blinkStart = null;               // моргнули — планируем следующее
    // иногда двойное моргание
    const doubleBlink = Math.random() < 0.25;
    nextBlinkTime = now + (doubleBlink ? 350 : 2000 + Math.random() * 4000);
    return 0;
  }
}

/* ---------- Отрисовка ---------- */
let eyeDotsCache = null;
let cacheKey = '';

function draw() {
  ctx.clearRect(0, 0, W, H);

  // фоновая интерактивная сетка точек
  for (const d of dots) {
    const dx = d.x - mouse.x;
    const dy = d.y - mouse.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const t = Math.max(0, 1 - dist / RANGE);
    const r = RADIUS + (MAX_R - RADIUS) * t;
    const alpha = 0.25 + 0.75 * t;
    ctx.beginPath();
    ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }

  // глаза
  const now = performance.now();
  const blink = getBlink(now);
  blinkPhase = blink;

  // направление взгляда (куда смотрит курсор относительно центра глаз)
  let lookX = 0, lookY = 0;
  if (mouse.x > -9000) {
    const ecx = W / 2, ecy = eyes.length ? eyes[0].cy : H / 2;
    const dx = mouse.x - ecx;
    const dy = mouse.y - ecy;
    const dist = Math.max(1, Math.sqrt(dx*dx + dy*dy));
    const strength = Math.min(1, dist / (Math.min(W, H) * 0.4));
    lookX = (dx / dist) * strength;
    lookY = (dy / dist) * strength;
  } else {
    // лёгкий авто-дрейф взгляда, когда курсора нет
    lookX = Math.sin(now / 2500) * 0.3;
    lookY = Math.cos(now / 3300) * 0.15;
  }

  // перестроение точек глаз при ресайзе
  const key = W + 'x' + H;
  if (cacheKey !== key || !eyeDotsCache) {
    eyeDotsCache = buildEyeDots();
    cacheKey = key;
  }

  const open = 1 - blink; // 1 = открыт, 0 = закрыт

  for (let ei = 0; ei < 2; ei++) {
    const e = eyes[ei];
    const pts = eyeDotsCache[ei];

    // точки радужки/глаза: сжимаются по вертикали при моргании
    for (const p of pts) {
      const y = e.cy + p.v * e.s * open;         // squash по вертикали
      const x = p.ox;
      // блики: верхняя часть ярче
      const shine = 0.5 + 0.5 * Math.max(0, -p.v);
      const edge = 1 - Math.sqrt(p.u * p.u + (p.v * p.v) / 0.7); // темнее к краю
      const alpha = Math.min(1, 0.35 + 0.65 * shine) * (0.4 + 0.6 * Math.max(0.15, edge));
      ctx.beginPath();
      ctx.arc(x, y, 1.6 + 1.4 * shine, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(160,200,255,${alpha * (open > 0.05 ? 1 : 0)})`;
      ctx.fill();
    }

    // зрачок (тоже сжимается при моргании)
    if (open > 0.08) {
      const pp = pupilPoints(ei, lookX, lookY, blink);
      for (const p of pp) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(20,25,60,0.95)';
        ctx.fill();
      }
      // блик зрачка — пара крупных белых точек
      const hx = e.cx + lookX * e.s * 0.42 * (1 - blink) - e.s * 0.12;
      const hy = e.cy + lookY * e.s * 0.42 * 0.8 * (1 - blink) - e.s * 0.14;
      ctx.beginPath();
      ctx.arc(hx, hy, 4.5 * open, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(hx + e.s * 0.16, hy + e.s * 0.12, 2.2 * open, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.fill();
    }

    // линия закрытого века при моргании (точки вдоль оси глаза)
    if (blink > 0.55) {
      const a = (blink - 0.55) / 0.45; // 0..1
      for (let x = -e.s; x <= e.s; x += GAP * 0.4) {
        const u = x / e.s;
        const yy = e.cy + Math.sin(u * Math.PI * 0.9) * e.s * 0.06;
        ctx.beginPath();
        ctx.arc(e.cx + x, yy, 1.8, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,220,255,${0.8 * a})`;
        ctx.fill();
      }
    }

    // ресницы: несколько точек над внешним краем глаза
    if (open > 0.05) {
      for (let k = 0; k < 5; k++) {
        const u = -0.9 + k * 0.45;
        const vx = e.cx + u * e.s;
        const vy = e.cy - e.s * (0.82 + 0.1 * Math.sin(k)) * open - 6;
        ctx.beginPath();
        ctx.arc(vx, vy, 1.6, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${0.5 * open})`;
        ctx.fill();
      }
    }
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
