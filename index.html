<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ДР Полино</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #090c13; color: #fff; font-family: Arial, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; padding-top: clamp(48px, 12vh, 90px); pointer-events: none; }
    h1 { margin: 0 0 24px; font-size: clamp(27px, 4vw, 42px); font-weight: 300; letter-spacing: 1px; }
    .timer { display: flex; gap: 14px; }
    .unit { width: clamp(76px, 10vw, 105px); height: 78px; border: 1px solid rgba(255,255,255,.2); border-radius: 9px; background: rgba(255,255,255,.035); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .num { font-size: clamp(28px, 4vw, 38px); font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }
    .label { margin-top: 7px; font-size: 9px; color: rgba(255,255,255,.55); text-transform: uppercase; }
  </style>
</head>
<body>
<canvas id="dots"></canvas>
<div class="content">
  <h1>ДР Полино через:</h1>
  <div class="timer">
    <div class="unit"><div class="num" id="days">00</div><div class="label">дней</div></div>
    <div class="unit"><div class="num" id="hours">00</div><div class="label">часов</div></div>
    <div class="unit"><div class="num" id="minutes">00</div><div class="label">минут</div></div>
    <div class="unit"><div class="num" id="seconds">00</div><div class="label">секунд</div></div>
  </div>
</div>
<script>
  const target = (() => { const n = new Date(); let d = new Date(n.getFullYear(), 8, 23); if (d <= n) d = new Date(n.getFullYear() + 1, 8, 23); return d; })();
  function updateTimer() {
    const diff = target - new Date();
    if (diff <= 0) { document.querySelector('h1').textContent = '🎉 С Днём Рождения, Полина! 🎉'; return; }
    document.getElementById('days').textContent = String(Math.floor(diff / 86400000)).padStart(2, '0');
    document.getElementById('hours').textContent = String(Math.floor(diff / 3600000) % 24).padStart(2, '0');
    document.getElementById('minutes').textContent = String(Math.floor(diff / 60000) % 60).padStart(2, '0');
    document.getElementById('seconds').textContent = String(Math.floor(diff / 1000) % 60).padStart(2, '0');
  }
  updateTimer(); setInterval(updateTimer, 1000);

  const canvas = document.getElementById('dots'), ctx = canvas.getContext('2d');
  const GAP = 19, mouse = { x: -9999, y: -9999 };
  let W, H, dots = [], face = [];

  // Пиксельная маска: каждая единица — настоящая точка общей неподвижной сетки.
  const eye = [
    '       1111111       ',
    '    1111111111111    ',
    '  11111111111111111  ',
    ' 1111111111111111111 ',
    '111111111111111111111',
    '111111111111111111111',
    '111111111111111111111',
    '111111111111111111111',
    ' 1111111111111111111 ',
    '  11111111111111111  ',
    '    1111111111111    ',
    '       1111111       '
  ];
  const pupil = [
    '      111      ',
    '    1111111    ',
    '   111111111   ',
    '   111111111   ',
    '    1111111    ',
    '      111      '
  ];

  function gridPoint(x, y) { return dots[y * Math.ceil(W / GAP + 2) + x]; }

  function build() {
    W = canvas.width = innerWidth; H = canvas.height = innerHeight; dots = []; face = [];
    const cols = Math.ceil(W / GAP) + 2, rows = Math.ceil(H / GAP) + 2;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) dots.push({ x: x * GAP, y: y * GAP, gx: x, gy: y });

    const width = eye[0].length, height = eye.length;
    const gap = Math.max(9, Math.round(width * .7));
    const startX = Math.round(cols / 2 - (width + gap) / 2);
    const startY = Math.max(15, Math.round(rows * .63));
    const left = [], right = [];
    for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) if (eye[y][x] === '1') {
      const a = gridPoint(startX + x, startY + y), b = gridPoint(startX + x + gap, startY + y);
      if (a) left.push(a); if (b) right.push(b);
    }
    const pw = pupil[0].length, ph = pupil.length;
    const pupilX = Math.floor((width - pw) / 2), pupilY = 3;
    for (let y = 0; y < ph; y++) for (let x = 0; x < pw; x++) if (pupil[y][x] === '1') {
      const a = gridPoint(startX + pupilX + x, startY + pupilY + y), b = gridPoint(startX + pupilX + x + gap, startY + pupilY + y);
      if (a) a.kind = 'pupil'; if (b) b.kind = 'pupil';
    }
    left.forEach(d => d.kind = d.kind || 'iris'); right.forEach(d => d.kind = d.kind || 'iris');
    face = [...left, ...right];
  }
  addEventListener('resize', build); build();
  addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }, { passive: true });

  function animate(time) {
    ctx.clearRect(0, 0, W, H);
    const blink = ((time % 6200) > 5000 && (time % 6200) < 5350) ? Math.max(.04, ((time % 6200) < 5175 ? 1 - (time % 6200 - 5000) / 175 : ((time % 6200) - 5175) / 175)) : 1;
    const special = new Set(face);
    for (const d of dots) {
      const dist = Math.hypot(d.x - mouse.x, d.y - mouse.y), hover = Math.max(0, 1 - dist / 150);
      let radius = 1.25 + hover * 3.5, alpha = .16 + hover * .72, color = '255,255,255';
      if (special.has(d)) {
        const glow = d.kind === 'pupil' ? .95 : .65;
        radius = (d.kind === 'pupil' ? 2.6 : 2.15) * (d.kind === 'pupil' ? blink : 1);
        alpha = d.kind === 'pupil' ? .18 + .82 * blink : .55 + glow * .35;
        color = d.kind === 'pupil' ? '255,255,255' : '238,151,221';
      }
      ctx.beginPath(); ctx.arc(d.x, d.y, radius, 0, Math.PI * 2); ctx.fillStyle = `rgba(${color},${alpha})`; ctx.fill();
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
</script>
</body>
</html>
