<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДР Полино</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1}
.content{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
h1{font-size:clamp(1.8rem,5vw,3.5rem);font-weight:300;letter-spacing:2px;margin-bottom:40px;text-shadow:0 0 20px rgba(255,255,255,.3)}
.timer{display:flex;gap:clamp(10px,3vw,30px);flex-wrap:wrap;justify-content:center}
.unit{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:20px 25px;min-width:100px;backdrop-filter:blur(10px)}
.num{font-size:clamp(2rem,6vw,4rem);font-weight:200;font-variant-numeric:tabular-nums}.label{font-size:.85rem;opacity:.6;text-transform:uppercase;letter-spacing:2px;margin-top:6px}
</style>
</head>
<body>
<canvas id="dots"></canvas>
<div class="content"><h1>ДР Полино через:</h1><div class="timer">
<div class="unit"><div class="num" id="days">00</div><div class="label">дней</div></div>
<div class="unit"><div class="num" id="hours">00</div><div class="label">часов</div></div>
<div class="unit"><div class="num" id="minutes">00</div><div class="label">минут</div></div>
<div class="unit"><div class="num" id="seconds">00</div><div class="label">секунд</div></div>
</div></div>
<script>
function getTargetDate(){const now=new Date();let year=now.getFullYear();let date=new Date(year,8,23);if(date<now)date=new Date(year+1,8,23);return date}
const target=getTargetDate();
function updateTimer(){const diff=target-new Date();if(diff<=0){document.querySelector('h1').textContent='🎉 С Днём Рождения, Полина! 🎉';return}document.getElementById('days').textContent=String(Math.floor(diff/86400000)).padStart(2,'0');document.getElementById('hours').textContent=String(Math.floor(diff/3600000)%24).padStart(2,'0');document.getElementById('minutes').textContent=String(Math.floor(diff/60000)%60).padStart(2,'0');document.getElementById('seconds').textContent=String(Math.floor(diff/1000)%60).padStart(2,'0')}
updateTimer();setInterval(updateTimer,1000);

const canvas=document.getElementById('dots'),ctx=canvas.getContext('2d');
const GAP=35,BASE_R=1.3,HOVER_R=6,RANGE=150,mouse={x:-9999,y:-9999};
let W,H,dots=[],creatureDots=[],creature={x:200,y:200,vx:0,vy:0,targetX:200,targetY:200};

// Эти символы превращаются в точки. Никаких отдельных фигур, линий или эллипсов нет.
const creatureMap=[
'      ..      ',
'     .oo.     ',
'   ..####..   ',
'  .########.  ',
' .##########. ',
' .##########. ',
'  .########.  ',
'   ..####..   ',
'      ..      ',
'  ..      ..  ',
' .          . ',
'              ',
'        ..    ',
'          ..  '
];

function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;dots=[];const cols=Math.ceil(W/GAP)+1,rows=Math.ceil(H/GAP)+1;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)dots.push({gridX:x*GAP,gridY:y*GAP,x:x*GAP,y:y*GAP,kind:'normal'});creature.x=Math.min(Math.max(creature.x,100),Math.max(100,W-100));creature.y=Math.min(Math.max(creature.y,100),Math.max(100,H-100));assignCreatureDots()}
function assignCreatureDots(){const wanted=creatureMap.reduce((n,row)=>n+[...row].filter(c=>c!== ' ').length,0);const center=dots.slice().sort((a,b)=>Math.hypot(a.gridX-W*.25,a.gridY-H*.5)-Math.hypot(b.gridX-W*.25,b.gridY-H*.5));creatureDots=center.slice(0,wanted);creatureDots.forEach((d,i)=>{d.kind=creatureMap.flatMap(row=>[...row].filter(c=>c!==' '))[i]})}
window.addEventListener('resize',resize);resize();
function move(e){const t=e.touches?e.touches[0]:e;mouse.x=t.clientX;mouse.y=t.clientY}window.addEventListener('mousemove',move);window.addEventListener('touchmove',move,{passive:true});window.addEventListener('touchstart',move,{passive:true});window.addEventListener('mouseleave',()=>{mouse.x=mouse.y=-9999});
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function updateCreature(time){if(time>creature.nextMove||!creature.nextMove){creature.targetX=80+Math.random()*Math.max(1,W-160);creature.targetY=80+Math.random()*Math.max(1,H-160);creature.nextMove=time+3500+Math.random()*2500}const dx=mouse.x-creature.x,dy=mouse.y-creature.y,dist=Math.hypot(dx,dy);if(dist<230&&dist>1){creature.targetX=creature.x-dx*.12;creature.targetY=creature.y-dy*.12}creature.vx+=(creature.targetX-creature.x)*.0008;creature.vy+=(creature.targetY-creature.y)*.0008;creature.vx*=.985;creature.vy*=.985;creature.x+=creature.vx;creature.y+=creature.vy;creature.x=clamp(creature.x,80,W-80);creature.y=clamp(creature.y,80,H-80)}
function creatureTarget(d,i,time){const cols=Math.max(...creatureMap.map(r=>r.length)),index=creatureDots.indexOf(d);let count=0,row=0,col=0;for(row=0;row<creatureMap.length;row++){for(col=0;col<creatureMap[row].length;col++){if(creatureMap[row][col]!==' '){if(count===index)break;count++}}if(count===index)break}const startX=creature.x-cols*GAP/2,startY=creature.y-creatureMap.length*GAP/2;return{x:startX+col*GAP,y:startY+row*GAP+Math.sin(time*.003+index)*1.5}}
function drawDot(x,y,r,color,alpha){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color.replace('ALPHA',alpha);ctx.fill()}
function animate(time){ctx.clearRect(0,0,W,H);updateCreature(time);const special=new Set(creatureDots);for(const d of dots){let tx=d.gridX,ty=d.gridY,color='rgba(255,255,255,ALPHA)',size=BASE_R;if(special.has(d)){const p=creatureTarget(d,0,time);tx=p.x;ty=p.y;color=d.kind==='o'?'rgba(245,225,255,ALPHA)':'rgba(175,195,255,ALPHA)';size=d.kind==='o'?2.8:2.1}d.x+=(tx-d.x)*.12;d.y+=(ty-d.y)*.12;const dist=Math.hypot(d.x-mouse.x,d.y-mouse.y),influence=Math.max(0,1-dist/RANGE);drawDot(d.x,d.y,size+(HOVER_R-size)*influence,color,.2+.8*influence)}requestAnimationFrame(animate)}
requestAnimationFrame(animate);
</script>
</body>
</html>
