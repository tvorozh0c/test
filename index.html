<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ДР Полино</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0a0a0f;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 1;
      display: block;
    }
    .content {
      position: relative;
      z-index: 2;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 40px;
      text-shadow: 0 0 20px rgba(255,255,255,0.3);
    }
    .timer {
      display: flex;
      gap: clamp(10px, 3vw, 30px);
      flex-wrap: wrap;
      justify-content: center;
    }
    .unit {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 20px 25px;
      min-width: 100px;
      backdrop-filter: blur(10px);
    }
    .num {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 200;
      font-variant-numeric: tabular-nums;
    }
    .label {
      font-size: 0.85rem;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <canvas id="dots"></canvas>

  <div class="content">
    <h1>ДР Полино через:</h1>
    <div class="timer">
      <div class="unit"><div class="num" id="days">00</div><div class="label">дней</div></div>
      <div class="unit"><div class="num" id="hours">00</div><div class="label">часов</div></div>
      <div class="unit"><div class="num" id="minutes">00</div><div class="label">минут</div></div>
      <div class="unit"><div class="num" id="seconds">00</div><div class="label">секунд</div></div>
    </div>
  </div>

  <script>
    function getTargetDate() {
      const now = new Date();
      let year = now.getFullYear();
      let date = new Date(year, 8, 23);
      if (date < now) date = new Date(year + 1, 8, 23);
      return date;
    }

    const target = getTargetDate();

    function updateTimer() {
      const diff = target - new Date();
      if (diff <= 0) {
        document.querySelector('h1').textContent = '🎉 С Днём Рождения, Полина! 🎉';
        return;
      }
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff / 3600000) % 24);
      const m = Math.floor((diff / 60000) % 60);
      const s = Math.floor((diff / 1000) % 60);

      document.getElementById('days').textContent = String(d).padStart(2, '0');
      document.getElementById('hours').textContent = String(h).padStart(2, '0');
      document.getElementById('minutes').textContent = String(m).padStart(2, '0');
      document.getElementById('seconds').textContent = String(s).padStart(2, '0');
    }

    updateTimer();
    setInterval(updateTimer, 1000);

    const canvas = document.getElementById('dots');
    const ctx = canvas.getContext('2d');

    let W = 0, H = 0;
    const mouse = { x: -9999, y: -9999 };
    const GAP = 35;
    const BASE_R = 1.4;
    const HOVER_R = 6;
    const RANGE = 150;

    const dots = [];
    const faceCells = new Set();

    function buildGrid() {
      dots.length = 0;
      faceCells.clear();

      const cols = Math.ceil(W / GAP) + 2;
      const rows = Math.ceil(H / GAP) + 2;

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const px = x * GAP;
          const py = y * GAP;
          dots.push({ x: px, y: py, baseX: px, baseY: py, r: BASE_R, glow: 0.1 });
        }
      }

      const faceCenterX = Math.round(W / 2 / GAP);
      const faceCenterY = Math.round(H / 2 / GAP);

      const eyeMask = [
        '00100',
        '01110',
        '11111',
        '01110',
        '00100'
      ];

      for (let row = 0; row < eyeMask.length; row++) {
        for (let col = 0; col < eyeMask[row].length; col++) {
          if (eyeMask[row][col] === '1') {
            const x1 = faceCenterX - 6 + col;
            const y1 = faceCenterY - 2 + row;
            const x2 = faceCenterX + 4 + col;
            const y2 = faceCenterY - 2 + row;
            faceCells.add(`${x1},${y1}`);
            faceCells.add(`${x2},${y2}`);
          }
        }
      }

      const mouthMask = [
        '0000000',
        '0000000',
        '0001100',
        '0011110',
        '0001100',
        '0000000',
        '0000000'
      ];

      for (let row = 0; row < mouthMask.length; row++) {
        for (let col = 0; col < mouthMask[row].length; col++) {
          if (mouthMask[row][col] === '1') {
            const x = faceCenterX - 3 + col;
            const y = faceCenterY + 6 + row;
            faceCells.add(`${x},${y}`);
          }
        }
      }
    }

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      buildGrid();
    }

    window.addEventListener('resize', resize);
    resize();

    function onMove(e) {
      const t = e.touches ? e.touches[0] : e;
      mouse.x = t.clientX;
      mouse.y = t.clientY;
    }

    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, { passive: true });
    window.addEventListener('touchstart', onMove, { passive: true });
    window.addEventListener('mouseleave', () => {
      mouse.x = -9999;
      mouse.y = -9999;
    });

    function drawDot(dot, blinkStrength, time) {
      const dx = dot.x - mouse.x;
      const dy = dot.y - mouse.y;
      const dist = Math.hypot(dx, dy);
      const t = Math.max(0, 1 - dist / RANGE);
      const pulse = 0.5 + Math.sin(time * 0.003 + dot.baseX * 0.15 + dot.baseY * 0.08) * 0.5;
      const cellKey = `${Math.round(dot.baseX / GAP)},${Math.round(dot.baseY / GAP)}`;
      const isFaceDot = faceCells.has(cellKey);

      let alpha = 0.18 + t * 0.82 + pulse * 0.15;
      let size = BASE_R + t * (HOVER_R - BASE_R);

      if (isFaceDot) {
        alpha = 0.35 + blinkStrength * 0.85 + pulse * 0.45;
        size = 2.4 + pulse * 1.1;
      }

      ctx.beginPath();
      ctx.arc(dot.x, dot.y, size, 0, Math.PI * 2);
      ctx.fillStyle = isFaceDot ? 'rgba(220, 230, 255, ' + alpha + ')' : 'rgba(255,255,255,' + alpha + ')';
      ctx.fill();
    }

    function animate(time) {
      ctx.clearRect(0, 0, W, H);

      const blink = (() => {
        const cycle = (Math.sin(time * 0.0018) + 1) / 2;
        const blinkWave = Math.max(0, Math.sin(time * 0.0027));
        return Math.max(0.08, 0.35 + cycle * 0.5 + blinkWave * 0.7);
      })();

      const blinkStrength = Math.max(0.1, Math.sin(time * 0.003) * 0.7 + 0.75);

      for (const dot of dots) {
        drawDot(dot, blinkStrength, time);
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
