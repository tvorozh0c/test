<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДР Полино</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0f;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #fff;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }
  .content {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
  }
  h1 {
    font-size: clamp(1.8rem, 5vw, 3.5rem);
    font-weight: 300;
    letter-spacing: 2px;
    margin-bottom: 40px;
    text-shadow: 0 0 20px rgba(255,255,255,0.3);
  }
  .timer {
    display: flex;
    gap: clamp(10px, 3vw, 30px);
    flex-wrap: wrap;
    justify-content: center;
  }
  .unit {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 20px 25px;
    min-width: 100px;
    backdrop-filter: blur(10px);
  }
  .num {
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
  }
  .label {
    font-size: 0.85rem;
    opacity: 0.6;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 6px;
  }
</style>
</head>
<body>

<canvas id="dots"></canvas>

<div class="content">
  <h1>ДР Полино через:</h1>
  <div class="timer">
    <div class="unit"><div class="num" id="days">00</div><div class="label">дней</div></div>
    <div class="unit"><div class="num" id="hours">00</div><div class="label">часов</div></div>
    <div class="unit"><div class="num" id="minutes">00</div><div class="label">минут</div></div>
    <div class="unit"><div class="num" id="seconds">00</div><div class="label">секунд</div></div>
  </div>
</div>

<script>
/* ---------- Таймер до 23 сентября ---------- */
function getTargetDate() {
  const now = new Date();
  let year = now.getFullYear();
  let target = new Date(year, 8, 23);
  if (target < now) target = new Date(year + 1, 8, 23);
  return target;
}
const target = getTargetDate();

function updateTimer() {
  const diff = target - new Date();
  if (diff <= 0) {
    document.querySelector('h1').textContent = '🎉 С Днём Рождения, Полина! 🎉';
    return;
  }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff / 3600000) % 24);
  const m = Math.floor((diff / 60000) % 60);
  const s = Math.floor((diff / 1000) % 60);
  document.getElementById('days').textContent = String(d).padStart(2,'0');
  document.getElementById('hours').textContent = String(h).padStart(2,'0');
  document.getElementById('minutes').textContent = String(m).padStart(2,'0');
  document.getElementById('seconds').textContent = String(s).padStart(2,'0');
}
updateTimer();
setInterval(updateTimer, 1000);

/* ---------- Сетка точек + существо из точек ---------- */
const canvas = document.getElementById('dots');
const ctx = canvas.getContext('2d');
let W, H, dots = [];
const mouse = { x: -9999, y: -9999 };
const GAP = 35;
const baseRadius = 1.4;
const hoverRadius = 6;
const influenceRange = 150;

const creature = {
  x: 250,
  y: 200,
  vx: 0,
  vy: 0,
  targetX: 250,
  targetY: 200,
  a: 0
};

function buildGrid() {
  dots = [];
  const cols = Math.ceil(W / GAP) + 2;
  const rows = Math.ceil(H / GAP) + 2;
  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      dots.push({
        x: i * GAP,
        y: j * GAP,
        baseX: i * GAP,
        baseY: j * GAP,
        active: 1,
        r: baseRadius
      });
    }
  }
}

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  buildGrid();
  creature.x = Math.min(Math.max(creature.x, 60), W - 60);
  creature.y = Math.min(Math.max(creature.y, 60), H - 60);
  creature.targetX = creature.x;
  creature.targetY = creature.y;
}
window.addEventListener('resize', resize);
resize();

function onMove(e) {
  const t = e.touches ? e.touches[0] : e;
  mouse.x = t.clientX;
  mouse.y = t.clientY;
}
window.addEventListener('mousemove', onMove);
window.addEventListener('touchmove', onMove, { passive: true });
window.addEventListener('touchstart', onMove, { passive: true });
window.addEventListener('mouseleave', () => {
  mouse.x = -9999;
  mouse.y = -9999;
});

function clamp(value, min, max) {
  return Math.min(Math.max(value, min), max);
}

function drawBackgroundGrid() {
  for (const d of dots) {
    let dx = d.x - mouse.x;
    let dy = d.y - mouse.y;
    let dist = Math.hypot(dx, dy);
    let t = Math.max(0, 1 - dist / influenceRange);
    let r = baseRadius + (hoverRadius - baseRadius) * t;
    let alpha = 0.2 + 0.8 * t;

    if (dist < 1) {
      r = hoverRadius;
      alpha = 1;
    }

    ctx.beginPath();
    ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }
}

function drawCreature(time) {
  creature.a += 0.025;

  if (time % 4200 < 30) {
    creature.targetX = 80 + Math.random() * (W - 160);
    creature.targetY = 80 + Math.random() * (H - 160);
  }

  if (mouse.x > -1000) {
    const dx = mouse.x - creature.x;
    const dy = mouse.y - creature.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 220) {
      creature.targetX = creature.x - dx * 0.12 + (Math.random() - 0.5) * 20;
      creature.targetY = creature.y - dy * 0.12 + (Math.random() - 0.5) * 20;
    }
  }

  creature.vx += (creature.targetX - creature.x) * 0.018;
  creature.vy += (creature.targetY - creature.y) * 0.018;
  creature.vx *= 0.9;
  creature.vy *= 0.9;
  creature.x += creature.vx;
  creature.y += creature.vy;
  creature.x = clamp(creature.x, 60, W - 60);
  creature.y = clamp(creature.y, 60, H - 60);

  const headR = 12;
  const bodyDots = [];

  for (let y = -4; y <= 4; y++) {
    for (let x = -12; x <= 12; x++) {
      const dist = Math.hypot(x, y);
      if (dist <= 11.5) {
        bodyDots.push({ x: creature.x + x * 6, y: creature.y + y * 6 + Math.sin(time * 0.003 + x) * 2 });
      }
    }
  }

  // хвост
  for (let i = 0; i < 10; i++) {
    const t = i / 10;
    const px = creature.x - 70 - i * 10 + Math.sin(time * 0.005 + i) * 8;
    const py = creature.y + Math.cos(time * 0.004 + i * 1.4) * (6 + i * 0.6);
    bodyDots.push({ x: px, y: py, r: 2.3 });
  }

  // глаза
  const eyeOffset = 12;
  const lookX = mouse.x > -999 ? clamp((mouse.x - creature.x) / 24, -3, 3) : 0;
  const lookY = mouse.y > -999 ? clamp((mouse.y - creature.y) / 24, -2, 2) : 0;

  const eyePositions = [
    { x: creature.x - eyeOffset, y: creature.y - 8 },
    { x: creature.x + eyeOffset, y: creature.y - 8 }
  ];

  for (const d of bodyDots) {
    const dx = d.x - mouse.x;
    const dy = d.y - mouse.y;
    const dist = Math.hypot(dx, dy);
    const t = Math.max(0, 1 - dist / influenceRange);
    const r = (d.r || baseRadius) + (hoverRadius - baseRadius) * t;
    const alpha = 0.7 + 0.3 * t;

    ctx.beginPath();
    ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(183, 202, 255, ${alpha})`;
    ctx.fill();
  }

  for (const eye of eyePositions) {
    const dx = eye.x - mouse.x;
    const dy = eye.y - mouse.y;
    const dist = Math.hypot(dx, dy);
    const t = Math.max(0, 1 - dist / influenceRange);
    const pupilR = 2 + t * 1.8;
    const px = eye.x + lookX * 1.6;
    const py = eye.y + lookY * 1.6;

    ctx.beginPath();
    ctx.arc(px, py, pupilR, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(px + 1, py - 0.5, pupilR * 0.45, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.95)';
    ctx.fill();
  }

  // рот
  ctx.beginPath();
  ctx.arc(creature.x, creature.y + 18, 10, 0.2, Math.PI - 0.2);
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function animate(time) {
  ctx.clearRect(0, 0, W, H);
  drawBackgroundGrid();
  drawCreature(time);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
