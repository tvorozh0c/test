<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДР Полино</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0f;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #fff;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }
  .content {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
  }
  h1 {
    font-size: clamp(1.8rem, 5vw, 3.5rem);
    font-weight: 300;
    letter-spacing: 2px;
    margin-bottom: 40px;
    text-shadow: 0 0 20px rgba(255,255,255,0.3);
  }
  .timer {
    display: flex;
    gap: clamp(10px, 3vw, 30px);
    flex-wrap: wrap;
    justify-content: center;
  }
  .unit {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 20px 25px;
    min-width: 100px;
    backdrop-filter: blur(10px);
  }
  .num {
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
  }
  .label {
    font-size: 0.85rem;
    opacity: 0.6;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 6px;
  }
</style>
</head>
<body>

<canvas id="dots"></canvas>

<div class="content">
  <h1>ДР Полино через:</h1>
  <div class="timer">
    <div class="unit"><div class="num" id="days">00</div><div class="label">дней</div></div>
    <div class="unit"><div class="num" id="hours">00</div><div class="label">часов</div></div>
    <div class="unit"><div class="num" id="minutes">00</div><div class="label">минут</div></div>
    <div class="unit"><div class="num" id="seconds">00</div><div class="label">секунд</div></div>
  </div>
</div>

<script>
/* ---------- Таймер до 23 сентября ---------- */
function getTargetDate() {
  const now = new Date();
  let year = now.getFullYear();
  let target = new Date(year, 8, 23); // месяц 8 = сентябрь
  if (target < now) target = new Date(year + 1, 8, 23);
  return target;
}
const target = getTargetDate();

function updateTimer() {
  const diff = target - new Date();
  if (diff <= 0) {
    document.querySelector('h1').textContent = '🎉 С Днём Рождения, Полина! 🎉';
    return;
  }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff / 3600000) % 24);
  const m = Math.floor((diff / 60000) % 60);
  const s = Math.floor((diff / 1000) % 60);
  document.getElementById('days').textContent    = String(d).padStart(2,'0');
  document.getElementById('hours').textContent   = String(h).padStart(2,'0');
  document.getElementById('minutes').textContent = String(m).padStart(2,'0');
  document.getElementById('seconds').textContent = String(s).padStart(2,'0');
}
updateTimer();
setInterval(updateTimer, 1000);

/* ---------- Сетка точек и отдельное живое существо ---------- */
const canvas = document.getElementById('dots');
const ctx = canvas.getContext('2d');
let W, H, dots = [];
const mouse = { x: -9999, y: -9999 };
const GAP = 35;
const RADIUS = 1.2;
const MAX_R = 6;
const RANGE = 150;

// Существо живёт отдельно от сетки, но реагирует на тот же курсор.
const creature = {
  x: 160, y: 160, vx: 0, vy: 0,
  phase: Math.random() * Math.PI * 2,
  targetX: 160, targetY: 160,
  nextMove: 0
};

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  dots = [];
  const cols = Math.ceil(W / GAP) + 1;
  const rows = Math.ceil(H / GAP) + 1;
  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      dots.push({ x: i * GAP, y: j * GAP });
    }
  }
  creature.x = Math.min(Math.max(creature.x, 80), W - 80);
  creature.y = Math.min(Math.max(creature.y, 80), H - 80);
}
window.addEventListener('resize', resize);
resize();

function onMove(e) {
  const t = e.touches ? e.touches[0] : e;
  mouse.x = t.clientX;
  mouse.y = t.clientY;
}
window.addEventListener('mousemove', onMove);
window.addEventListener('touchmove', onMove, { passive: true });
window.addEventListener('touchstart', onMove, { passive: true });
window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

function drawGrid() {
  for (const d of dots) {
    const dx = d.x - mouse.x;
    const dy = d.y - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const t = Math.max(0, 1 - dist / RANGE);
    const r = RADIUS + (MAX_R - RADIUS) * t;
    const alpha = 0.25 + 0.75 * t;
    ctx.beginPath();
    ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }
}

function drawCreature(time) {
  const seconds = time / 1000;
  creature.phase += 0.035;

  // Вдали от курсора существо спокойно странствует по экрану.
  if (seconds > creature.nextMove) {
    creature.targetX = 90 + Math.random() * Math.max(1, W - 180);
    creature.targetY = 90 + Math.random() * Math.max(1, H - 180);
    creature.nextMove = seconds + 2.5 + Math.random() * 3;
  }

  // Рядом с курсором существо заинтересованно тянется к нему, не прилипая.
  if (mouse.x > -1000) {
    const dx = mouse.x - creature.x;
    const dy = mouse.y - creature.y;
    const distance = Math.hypot(dx, dy);
    if (distance < 280 && distance > 75) {
      creature.targetX = mouse.x - (dx / distance) * 70;
      creature.targetY = mouse.y - (dy / distance) * 70;
    }
  }

  creature.vx += (creature.targetX - creature.x) * 0.0008;
  creature.vy += (creature.targetY - creature.y) * 0.0008;
  creature.vx *= 0.985;
  creature.vy *= 0.985;
  creature.x += creature.vx;
  creature.y += creature.vy;

  const bob = Math.sin(creature.phase) * 4;
  const angle = Math.atan2(creature.vy, creature.vx) || 0;
  const x = creature.x;
  const y = creature.y + bob;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle * 0.18);
  ctx.shadowBlur = 28;
  ctx.shadowColor = 'rgba(157, 121, 255, 0.8)';

  // Хвост из нескольких светящихся точек подчёркивает, что это часть мира точек.
  for (let i = 3; i > 0; i--) {
    const tailX = -34 - i * 12;
    const tailY = Math.sin(creature.phase - i * 0.7) * 8;
    ctx.beginPath();
    ctx.arc(tailX, tailY, 3 + i * 1.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(177, 143, 255, ${0.25 + i * 0.12})`;
    ctx.fill();
  }

  // Мягкое тело существа.
  ctx.beginPath();
  ctx.ellipse(0, 0, 38, 29, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(117, 86, 196, 0.78)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(225, 213, 255, 0.8)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Усики.
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(-12, -22); ctx.quadraticCurveTo(-20, -43, -30, -40);
  ctx.moveTo(12, -22); ctx.quadraticCurveTo(20, -43, 30, -40);
  ctx.strokeStyle = 'rgba(225, 213, 255, 0.85)';
  ctx.stroke();
  for (const antenna of [{ x: -30, y: -40 }, { x: 30, y: -40 }]) {
    ctx.beginPath();
    ctx.arc(antenna.x, antenna.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#eadfff';
    ctx.fill();
  }

  // Глаза смотрят в сторону курсора, если он рядом.
  const lookX = mouse.x > -1000 ? Math.max(-3, Math.min(3, (mouse.x - x) / 35)) : 0;
  const lookY = mouse.y > -1000 ? Math.max(-3, Math.min(3, (mouse.y - y) / 35)) : 0;
  for (const eyeX of [-13, 13]) {
    ctx.beginPath();
    ctx.arc(eyeX, -5, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(eyeX + lookX, -5 + lookY, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#171323';
    ctx.fill();
  }

  // Маленькая улыбка.
  ctx.beginPath();
  ctx.arc(0, 5, 10, 0.15, Math.PI - 0.15);
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function draw(time) {
  ctx.clearRect(0, 0, W, H);
  drawGrid();
  drawCreature(time);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
